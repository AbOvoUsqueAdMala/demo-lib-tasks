name: Verify adapters and independent libraries

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout KZ library
        uses: actions/checkout@v4
        with:
          repository: AbOvoUsqueAdMala/orders-extension-kz
          ref: main
          path: .build/libraries/orders-extension-kz
      - name: Checkout AZ library
        uses: actions/checkout@v4
        with:
          repository: AbOvoUsqueAdMala/orders-extension-az
          ref: main
          path: .build/libraries/orders-extension-az
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install independent libraries
        run: |
          mvn -B -ntp -f .build/libraries/orders-extension-kz/pom.xml install -DskipTests
          mvn -B -ntp -f .build/libraries/orders-extension-az/pom.xml install -DskipTests
      - name: Build and run PostgreSQL integration tests
        run: mvn -B -ntp clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: demo-app/target/failsafe-reports/
